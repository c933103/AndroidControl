android {
    namespace 'org.androidcontrol.app'
    defaultConfig {
        applicationId "org.androidcontrol.app"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        testInstrumentationRunner 'org.androidcontrol.app.regression.RuntimeRegressionInstrumentation'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    // GPL-3-derived call recorder uses scrcpy's Apache-2.0 server, pinned by SHA-256.
    defaultConfig {
        buildConfigField 'String', 'SCRCPY_VERSION', '"4.0"'
        buildConfigField 'String', 'SCRCPY_SERVER_SHA256', '"84924bd564a1eb6089c872c7521f968058977f91f5ff02514a8c74aff3210f3a"'
        buildConfigField 'String', 'SCRCPY_SERVER_ASSET_NAME', '"scrcpy-server"'
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/scrcpy').get().asFile)
    buildFeatures {
        aidl true
        buildConfig true
        viewBinding true
        prefab true
    }
    signingConfigs {
        sign
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sign
        }
        release {
            signingConfig signingConfigs.sign
            minifyEnabled true
            shrinkResources true
            vcsInfo.include false
            proguardFiles 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version = "3.31.0+"
        }
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['**']
        }
    }
    dependenciesInfo {
        includeInApk false
    }
    lint {
        checkReleaseBuilds false
    }
}

